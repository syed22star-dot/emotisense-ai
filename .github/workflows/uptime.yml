name: EmotiSense AI Uptime Keep-Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping deployed service health endpoint
        run: |
          if [ -z "${{ secrets.EMOTISENSE_HEALTH_URL }}" ]; then
            echo "Set EMOTISENSE_HEALTH_URL secret to enable automated uptime checks."
            exit 0
          fi
          HTTP_CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 45 "${{ secrets.EMOTISENSE_HEALTH_URL }}")
          cat /tmp/health.json
          echo ""
          echo "HTTP Status: $HTTP_CODE"
          test "$HTTP_CODE" -eq 200
